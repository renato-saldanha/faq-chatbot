name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend/
        id: detect
        run: echo "exists=$([ -f backend/requirements.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: pip install -r requirements.txt
      - name: ruff check
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: ruff check .
      - name: ruff format --check
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: ruff format --check .
      - name: mypy
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: mypy .
      - name: pytest
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/faq_chatbot_test
          SIMILARITY_BACKEND: fuzzy
          SIMILARITY_THRESHOLD: "0.6"
        run: pytest -v
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: faq_chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  frontend:
    name: frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend/
        id: detect
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm lint
      - name: typecheck
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm typecheck
      - name: test
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm test
      - name: build
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm build

  docker-build:
    name: docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect docker-compose.yml
        id: detect
        run: echo "exists=$([ -f docker-compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: docker compose build
        if: steps.detect.outputs.exists == 'true'
        run: docker compose build
