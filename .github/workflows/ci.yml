name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend/
        id: detect
        run: echo "exists=$([ -f backend/requirements.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: pip install -r requirements.txt
      - name: ruff check
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: ruff check .
      - name: ruff format --check
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: ruff format --check .
      - name: mypy
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: mypy .
      - name: pytest
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: pytest -v

  frontend:
    name: frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend/
        id: detect
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint
      - name: typecheck
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck
      - name: test
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test
      - name: build
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

  e2e:
    name: e2e (docker compose + playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect docker-compose.yml
        id: detect
        run: echo "exists=$([ -f docker-compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci (frontend, para o Playwright)
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright chromium
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepara .env (backend fuzzy, sem segredo externo)
        if: steps.detect.outputs.exists == 'true'
        run: cp .env.example .env
      - name: docker compose build
        if: steps.detect.outputs.exists == 'true'
        run: docker compose build
      - name: docker compose up -d
        if: steps.detect.outputs.exists == 'true'
        run: docker compose up -d
      - name: Aguarda backend/frontend saudáveis
        if: steps.detect.outputs.exists == 'true'
        run: |
          until curl -sf http://localhost:8000/health && curl -sf http://localhost:3000 >/dev/null; do
            sleep 3
          done
      - name: playwright test
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npx playwright test
      - name: Logs do backend em caso de falha
        if: failure() && steps.detect.outputs.exists == 'true'
        run: docker compose logs backend
      - name: Upload do relatório Playwright
        if: failure() && steps.detect.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: docker compose down
        if: always() && steps.detect.outputs.exists == 'true'
        run: docker compose down -v
