name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend/
        id: detect
        run: echo "exists=$([ -f backend/requirements.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: pip install -r requirements.txt
      - name: ruff check
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: ruff check .
      - name: ruff format --check
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: ruff format --check .
      - name: mypy
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: mypy .
      - name: pytest
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: pytest -v

  frontend:
    name: frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend/
        id: detect
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint
      - name: typecheck
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck
      - name: test
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test
      - name: build
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

  docker-build:
    name: docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect docker-compose.yml
        id: detect
        run: echo "exists=$([ -f docker-compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: docker compose build
        if: steps.detect.outputs.exists == 'true'
        run: docker compose build
