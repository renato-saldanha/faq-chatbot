name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  review:
    name: automated review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read reviewer instructions
        id: agent_prompt
        run: |
          {
            echo "AGENT_INSTRUCTIONS<<EOF"
            sed '1{/^---$/!q};1,/^---$/d' .claude/agents/pr-reviewer.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run reviewer agent
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revise você mesmo, diretamente nesta sessão, o diff desta PR (base: origin/${{ github.event.pull_request.base.ref }}).
            NÃO delegue esta tarefa a nenhum subagente via Task/Agent — execute a análise inteira você mesmo, agora, seguindo as instruções abaixo.

            ${{ steps.agent_prompt.outputs.AGENT_INSTRUCTIONS }}
          claude_args: --model claude-sonnet-5

      - name: Extract verdict from execution log
        id: extract
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "Arquivo de execução não encontrado (\"$EXECUTION_FILE\") — falha explícita, nunca aprova silenciosamente."
            exit 1
          fi

          # O log é uma lista de eventos (stream-json); concatena o texto de
          # toda mensagem assistant, na ordem, para reconstituir a resposta final.
          FULL_TEXT=$(jq -r '
            if type == "array" then .[] else . end
            | select(.type == "assistant")
            | .message.content[]?
            | select(.type == "text")
            | .text
          ' "$EXECUTION_FILE" 2>/dev/null)

          if [ -z "$FULL_TEXT" ]; then
            echo "Não foi possível extrair texto do agente a partir de $EXECUTION_FILE — falha explícita."
            exit 1
          fi

          VERDICT_LINE=$(echo "$FULL_TEXT" | grep -oE '^VEREDICTO: (SHIP_CLEAN|SHIP|FIX_AND_RESUBMIT)\s*$' | tail -n1)
          if [ -z "$VERDICT_LINE" ]; then
            echo "Resposta do agente não terminou com a linha VEREDICTO: esperada — falha explícita, nunca aprova silenciosamente."
            echo "--- resposta completa do agente ---"
            echo "$FULL_TEXT"
            exit 1
          fi

          VERDICT=$(echo "$VERDICT_LINE" | sed -E 's/^VEREDICTO: //')
          SHOWSTOPPER_COUNT=$(echo "$FULL_TEXT" | grep -cE '^SHOWSTOPPER:' || true)

          echo "VERDICT=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "SHOWSTOPPER_COUNT=$SHOWSTOPPER_COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "FULL_TEXT<<EOF"
            echo "$FULL_TEXT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post review summary
        if: always()
        env:
          FULL_TEXT: ${{ steps.extract.outputs.FULL_TEXT }}
          VERDICT: ${{ steps.extract.outputs.VERDICT }}
        run: |
          {
            echo "## Review automatizado — veredicto: ${VERDICT:-desconhecido}"
            echo ""
            echo "$FULL_TEXT"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit review log
        if: always() && steps.extract.outcome == 'success'
        env:
          FULL_TEXT: ${{ steps.extract.outputs.FULL_TEXT }}
          VERDICT: ${{ steps.extract.outputs.VERDICT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p docs/reviews
          LOG_FILE="docs/reviews/pr-${PR_NUMBER}.md"
          {
            echo "# Review automatizado — PR #${PR_NUMBER}"
            echo ""
            echo "**Título:** ${PR_TITLE}"
            echo "**Commit avaliado:** ${COMMIT_SHA}"
            echo "**Veredicto:** ${VERDICT}"
            echo ""
            echo "---"
            echo ""
            echo "$FULL_TEXT"
          } > "$LOG_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$LOG_FILE"
          if git diff --cached --quiet; then
            echo "Log sem mudança em relação ao commit anterior, nada a commitar."
            exit 0
          fi
          git commit -m "chore(review): registra resultado do review automatizado — PR #${PR_NUMBER}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

      - name: Fail on showstoppers
        env:
          SHOWSTOPPER_COUNT: ${{ steps.extract.outputs.SHOWSTOPPER_COUNT }}
        run: |
          if [ -n "$SHOWSTOPPER_COUNT" ] && [ "$SHOWSTOPPER_COUNT" -gt 0 ]; then
            echo "$SHOWSTOPPER_COUNT showstopper(s) encontrado(s) — merge bloqueado até correção."
            exit 1
          fi
          echo "Sem showstoppers — review aprovado."
